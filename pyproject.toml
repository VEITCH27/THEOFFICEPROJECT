[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-integrity-cli"
version = "0.1.0"
description = "AI Model Runtime Integrity Checker — pre/post system state checksums"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Sentinel Contributors" },
]
keywords = ["security", "ai", "integrity", "audit", "gpg", "monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/model-integrity-cli/sentinel"
Repository = "https://github.com/model-integrity-cli/sentinel"
Documentation = "https://github.com/model-integrity-cli/sentinel#readme"

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
